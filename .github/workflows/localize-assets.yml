name: Localize original site assets

on:
  push:
    paths:
      - '.github/workflows/localize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original site images
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hatroom-store.humble-puppy-7935.chatgpt.site/images'
          mkdir -p images
          files=(
            'oat-cap.png'
            'navy-bucket.png'
            'sage-cap.png'
            'capability-01-pattern-sample.webp'
            'capability-02-materials.webp'
            'capability-03-craft-production.webp'
            'capability-04-mass-qc.webp'
            'capability-05-outdoor-development.webp'
            'capability-06-pack-delivery.webp'
            'boonie-hiker.webp'
            'newsboy-cap.webp'
            'sun-hat.webp'
            'winter-hat.webp'
            'rust-beret.png'
            'outdoor-hiker.webp'
            'forest-hiker.webp'
            'rock-hiker.webp'
            'technique-01-embroidery.webp'
            'technique-02-print-transfer.webp'
            'technique-03-label-patch.webp'
            'technique-04-mesh-panel.webp'
            'technique-05-adjustment.webp'
            'technique-06-outdoor-details.webp'
          )
          for file in "${files[@]}"; do
            echo "Downloading $file"
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 \
              "$BASE/$file" -o "images/$file"
            test -s "images/$file"
          done
          echo "Downloaded ${#files[@]} files."

      - name: Commit localized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Localize original Hatroom image assets'
          git push
